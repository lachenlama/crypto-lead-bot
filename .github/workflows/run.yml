name: run-bot
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts only, don't send or save"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: run-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEB3_CAREER_TOKEN: ${{ secrets.WEB3_CAREER_TOKEN }}
        run: python -m bot.main ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit db
        run: |
          if [ -n "$(git status --porcelain data/leads.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/leads.db
            git commit -m "chore: update leads db [skip ci]"
            git push
          fi
